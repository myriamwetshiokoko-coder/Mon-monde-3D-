name: Vérifications du jeu

on:
  push:
    branches: [main, 'develop/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Lire le projet
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Installer Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Vérifier la syntaxe
        run: |
          for file in src/*.js tests/*.cjs tools/*.cjs; do
            node --check "$file"
          done
      - name: Anciennes fonctionnalités et intégration
        run: node tests/simulation.test.cjs
      - name: Métiers et économie
        run: node tests/daily.test.cjs
      - name: Quartier et foyer autonomes
        run: node tests/neighbourhood.test.cjs
      - name: Personnages, sauvegardes et activités V2.5
        run: node tests/revision.test.cjs
      - name: Deux membres dans le même foyer V3
        run: node tests/home-control.test.cjs
      - name: Studio, poses et apparence V4
        run: node tests/refonte.test.cjs
      - name: Lumière, matières et activités V5
        run: node tests/immersion.test.cjs
      - name: Vie de foyer, logements et personnages V6
        run: node tests/family-life.test.cjs
      - name: Aménagement, trajets et sauvegardes V7
        run: node tests/arrangement.test.cjs
