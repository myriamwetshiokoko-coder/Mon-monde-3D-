ine-height:1.5;margin-bottom:13px}.stat-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f2f0f6;font-size:13px}.stat-row:last-child{border:0}.stat-row strong{font-variant-numeric:tabular-nums}.closet{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.swatch{height:42px;width:42px;border-radius:14px;border:3px solid transparent;background:#efedf8;font-size:21px;display:grid;place-items:center}.swatch.active{border-color:#7865ea;box-shadow:0 0 0 2px #e0daff}.timeline{border-left:2px solid #e6dfff;margin-left:6px;padding-left:16px}.logline{position:relative;margin:0 0 14px;font-size:12px;color:#757182;line-height:1.45}.logline:before{content:'';position:absolute;left:-22px;top:2px;border:3px solid white;border-radius:50%;height:9px;width:9px;background:#967fe9;box-shadow:0 0 0 1px #d6ccff}.logline b{color:#37334d}.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;position:fixed;z-index:30;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;padding:9px 8px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #eeebf3;background:#fffffff2;backdrop-filter:blur(16px);box-shadow:0 -8px 25px #3830610c}.nav button{display:flex;align-items:center;flex-direction:column;gap:4px;border:0;background:transparent;border-radius:12px;color:#aaa5b9;padding:8px 1px 4px;font-size:10px;font-weight:850}.nav button span{font-size:23px;line-height:1}.nav button.active{background:#efeaff;color:#6e57d2}.modal{position:fixed;z-index:55;inset:0;display:none;align-items:flex-end;justify-content:center;background:#1c173d9c;padding:16px 12px calc(16px + env(safe-area-inset-bottom));backdrop-filter:blur(4px)}.modal.on{display:flex}.dialog{background:#fff;border-radius:25px;padding:22px 19px 17px;width:100%;max-width:465px;box-shadow:0 30px 70px #1d173e55;max-height:84svh;overflow-y:auto}.dialog .big{font-size:45px;text-align:center}.dialog h2{text-align:center;font-size:21px;letter-spacing:-.4px;margin:8px 0}.dialog p{text- <body>
<div class="app" id="app">
<header class="top"><div class="brand">✦ MYRIAM STORY STUDIO</div><div class="headrow"><div><h1>Ma vie, mes règles <span style="font-size:22px">✨</span></h1><p class="subtitle">La ville t'appartient. Écris ton histoire.</p></div><div class="daypill" id="clock"></div></div><div class="wallet"><div><div class="wallet-label">MON PORTEFEUILLE</div><div class="wallet-balance" id="wallet"></div></div><div class="wallet-rank" id="rank"></div></div><div class="meters" id="meters"></div></header>
<main id="screen" aria-live="polite"></main>
<nav class="nav" id="nav" aria-label="Navigation du jeu"><button type="button" data-tab="home"><span>🏠</span>Aujourd'hui</button><button type="button" data-tab="career"><span>💼</span>Carrière</button><button type="button" data-tab="empire"><span>🏢</span>Empire</button><button type="button" data-tab="city"><span>🌆</span>Ville</button><button type="button" data-tab="me"><span>💜</span>Moi</button></nav>
</div>
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="dialog" id="modal-body"></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const KEY='myriam-life-simulator-v1';
const clamp=(v)=>Math.max(0,Math.min(100,v));
const format=(n)=>Math.round(n).toLocaleString('fr-FR')+' DH';
const homes=[{id:'studio',name:'Petit studio',price:0,emoji:'🛏️',comfort:1,desc:'Un petit cocon pour commencer ton histoire.'},{id:'appart',name:'Appartement cosy',price:2500,emoji:'🏡',comfort:2,desc:'Ton premier vrai chez-toi, plus confortable.'},{id:'loft',name:'Loft lumineux',price:12000,emoji:'🌇',comfort:3,desc:'Une belle vue et beaucoup plus de confort.'},{id:'villa',name:'Villa avec piscine',price:60000,emoji:'🏖️',comfort:4,desc:'Le grand luxe, des souvenirs à créer.'},{id:'penthouse',name:'Penthouse de rêve',price:250000,emoji:'🏙️',comfort:5,desc:'Tout en haut de la ville.'}];
const cars=[{id:'walk',name:'À pied',price:0,emoji:'👟',desc:'Chaque grande histoire commence par un premier pas.'},{id:'scooter',name:'Scooter électrique',price:850,emoji:'🛵',desc:'Des déplacements rapides et pratiques.'},{id:'car',name:'Petite voiture',price:6500,emoji:'🚗',desc:'Liberté et autonomie.'},{id:'sedan',name:'Berline élégante',price:25000,emoji:'🚘',desc:'Le confort au quotidien.'},{id:'luxury',name:'Voiture de luxe',price:110000,emoji:'🏎️',desc:'Un nouveau standing.'}];
const jobs=[{id:'extra',emoji:'🛍️',name:'Employée polyvalente',pay:65,hours:3,energy:19,edu:0,social:0,desc:'Un point de départ honnête.'},{id:'assistant',emoji:'🗂️',name:'Assistante administrative',pay:135,hours:3,energy:20,edu:2,social:0,desc:'La première marche vers une belle carrière.'},{id:'commercial',emoji:'📈',name:'Commerciale',pay:215,hours:4,energy:24,edu:3,social:2,desc:'Les bons contacts font la différence.'},{id:'manager',emoji:'👩🏾‍💼',name:'Responsable de projet',pay:390,hours:4,energy:26,edu:5,social:3,desc:'Dirige une équipe et signe des projets.'},{id:'director',emoji:'💎',name:'Directrice générale',pay:750,hours:4,energy:28,edu:8,social:6,desc:'Une carrière au sommet.'}];
const businesses=[{id:'stand',emoji:'🧁',name:'Stand gourmand',cost:600,profit:65,skill:'cooking',req:1,desc:'Vends tes premières créations sucrées.'},{id:'eshop',emoji:'📦',name:'Boutique en ligne',cost:2500,profit:175,skill:'business',req:2,desc:'Des commandes même quand tu te reposes.'},{id:'cafe',emoji:'☕',name:'Café & pâtisserie',cost:8500,profit:530,skill:'cooking',req:3,desc:'Ouvre ton établissement en ville.'},{id:'agency',emoji:'🏢',name:'Agence créative',cost:30000,profit:1450,skill:'business',req:4,desc:'Construis une entreprise reconnue.'},{id:'holding',emoji:'🌍',name:'Groupe international',cost:170000,profit:6400,skill:'business',req:7,desc:'Ton véritable empire entrepreneurial.'}];
const skillNames={edu:'Études',social:'Réseau',cooking:'Cuisine',business:'Business'};
const randomQuests=()=>[{id:'work',title:'Faire une journée de travail',emoji:'💼'},{id:'learn',title:'Apprendre quelque chose',emoji:'📚'},{id:'self',title:'Prendre soin de toi',emoji:'🧖🏾‍♀️'}];
const defaultState=()=>({day:1,hour:8,money:250,earned:250,energy:85,hunger:80,mood:76,relations:50,edu:0,social:0,cooking:0,business:0,job:'extra',home:'studio',car:'walk',businesses:{},outfit:'lavender',hair:'natural',skin:'brown',xp:0,level:1,logs:[{day:1,text:'Myriam arrive à Nova City avec 250 DH et beaucoup d’ambition.'}],questDone:[],questClaimed:false,quests:randomQuests(),seenEvents:[],achievements:[],firstSeen:false,gigsDone:[],weekly:{week:1,work:0,study:0,social:0,claimed:false},lastMessageReplyDay:0});
let s;try{s=Object.assign(defaultState(),JSON.parse(localStorage.getItem(KEY)||'null')||{});}catch(_){s=defaultState();}
if(!s.businesses || typeof s.businesses!=='object')s.businesses={};if(!Array.isArray(s.logs))s.logs=[];if(!Array.isArray(s.questDone))s.questDone=[];if(!Array.isArray(s.achievements))s.achievements=[];if(!Array.isArray(s.seenEvents))s.seenEvents=[];if(!Array.isArray(s.quests)||!s.quests.length)s.quests=randomQuests();
if(!Array.isArray(s.gigsDone))s.gigsDone=[];
if(!Number.isFinite(s.lastMessageReplyDay))s.lastMessageReplyDay=0;
if(!s.weekly||typeof s.weekly!=='object')s.weekly={week:0,work:0,study:0,social:0,claimed:false};
let tab='home',toastTimer,chosenEvent=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(s));}catch(e){}}
function log(text){s.logs.unshift({day:s.day,text});s.logs=s.logs.slice(0,24);}
function notify(text){const x=document.getElementById('toast');x.textContent=text;x.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>x.classList.remove('show'),3000);}
function skillLevel(id){return Number(s[id])||0}
function activeHome(){return homes.find(h=>h.id===s.home)||homes[0]}
function rank(){if(s.money>=1000000)return'👑 Millionnaire';if(s.money>=100000)return'💎 Grande fortune';if(s.money>=20000)return'✨ Entrepreneure';if(s.money>=3000)return'🌸 En plein essor';return'🌱 Nouveau départ'}
function levelUp(){let target=100+s.level*55;while(s.xp>=target){s.xp-=target;s.level++;s.money+=75*s.level;log('⭐ Niveau '+s.level+' ! Bonus de '+format(75*s.level)+'.');target=100+s.level*55;}}
function gainXP(n){s.xp+=n;levelUp()}
function quest(id){if(s.questDone.includes(id)||!s.quests.some(q=>q.id===id))return;s.questDone.push(id);if(s.questDone.length===s.quests.length)notify('🎉 Missions du jour terminées ! Réclame ton bonus.');}
function achievement(id,check,msg){if(check&&!s.achievements.includes(id)){s.achievements.push(id);gainXP(40);log('🏆 Succès débloqué : '+msg);notify('🏆 Succès : '+msg);}}
function checkAchievements(){achievement('first500',s.earned>=500,'Premiers 500 DH');achievement('firstbiz',Object.keys(s.businesses).length>0,'Ma première entreprise');achievement('owner',s.home!=='studio','Mon chez-moi');achievement('rich',s.earned>=10000,'10 000 DH gagnés');achievement('mogul',s.earned>=100000,'100 000 DH gagnés');achievement('million',s.money>=1000000,'Millionnaire !')}
function dailyProfit(){return businesses.reduce((n,b)=>n+(s.businesses[b.id]?Math.round(b.profit*(1+(s.businesses[b.id]-1)*.65)):0),0)}
function rollDay(){s.day++;s.gigsDone=[];syncWeekly();s.quests=randomQuests();s.questDone=[];s.questClaimed=false;const income=dailyProfit();if(income>0){s.money+=income;s.earned+=income;log('💸 Tes entreprises rapportent '+format(income)+' de bénéfices.')}if(s.day%7===0 && s.home==='studio'){s.money-=90;log('🏠 Loyer hebdomadaire du studio : 90 DH.')}s.hunger=clamp(s.hunger-7);s.mood=clamp(s.mood-2);if(s.day%3===0){const ev=events.find(e=>!s.seenEvents.includes(e.id)&&(!e.minDay||s.day>=e.minDay))||events[Math.floor(s.day/3-1)%events.length];if(ev){if(!s.seenEvents.includes(ev.id))s.seenEvents.push(ev.id);chosenEvent=ev;setTimeout(()=>showEvent(ev),200);}}}
function advance(hours){s.hour+=hours;while(s.hour>=24){s.hour-=16;rollDay()}}
function act(p){if((p.cost||0)>s.money){notify('💳 Il te manque '+format(p.cost-s.money)+'.');return false}if(p.energy<0&&s.energy<-p.energy){notify('😴 Tu es trop fatiguée. Repose-toi d’abord !');return false}if(p.hunger<0&&s.hunger<12){notify('🥪 Tu dois manger avant de continuer.');return false}s.money+=(p.gain||0)-(p.cost||0);if(p.gain)s.earned+=p.gain;s.energy=clamp(s.energy+(p.energy||0));s.hunger=clamp(s.hunger+(p.hunger||0));s.mood=clamp(s.mood+(p.mood||0));s.relations=clamp(s.relations+(p.relations||0));if(p.skill)s[p.skill]=Math.min(10,(s[p.skill]||0)+(p.skillGain||1));if(p.hours)advance(p.hours);if(p.xp)gainXP(p.xp);if(p.quest)quest(p.quest);if(p.weekly)weeklyTick(p.weekly);if(p.msg){log(p.msg);notify(p.msg)}checkAchievements();save();render();return true}
function sleep(){s.energy=clamp(80+activeHome().comfort*4);s.hunger=clamp(s.hunger-18);s.mood=clamp(s.mood+12+activeHome().comfort*2);s.hour=8;rollDay();quest('self');gainXP(7);log('🌙 Une bonne nuit de sommeil. Nouvelle journée, nouvelles possibilités.');save();render();notify('☀️ Bonjour Myriam ! Jour '+s.day+'.')}
function svgAvatar(){let skin={brown:'#8e523b',deep:'#603725',caramel:'#bc7956',light:'#dda585'}[s.skin]||'#8e523b';let shirt={lavender:'#9e78f3',pink:'#ef7f9e',white:'#fff7ee',green:'#4fbaa0',black:'#2e2a40'}[s.outfit]||'#9e78f3';let hair=s.hair==='braids'?'braids':s.hair==='bun'?'bun':'natural';return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 240" class="avatar" aria-label="Myriam, personnage du jeu"><defs><linearGradient id="pant" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#283452"/><stop offset="1" stop-color="#181d36"/></linearGradient></defs><ellipse cx="90" cy="227" rx="42" ry="7" fill="#2b215e" opacity=".22"/><path d="M68 159 L64 209 Q68 218 79 213 L91 173 L101 213 Q113 219 118 210 L111 151" fill="url(#pant)"/><path d="M64 208 L76 208 Q80 214 81 224 L53 224 Q51 218 64 208 M103 208 L115 208 Q132 213 132 224 L99 224 Q98 216 103 208" fill="#f4f0e9" stroke="#dad7df" stroke-width="1"/><path d="M63 95 Q89 86 117 96 L127 156 Q92 172 52 157 Z" fill="${shirt}" stroke="#4d3d6c" stroke-opacity=".14" stroke-width="2"/><path d="M64 106 Q56 120 55 145 L45 167 Q42 173 35 166 Q32 162 37 157 L42 136 Q46 111 52 102" fill="${skin}"/><path d="M114 104 Q127 120 128 144 L137 165 Q143 173 150 167 Q153 162 147 157 L142 138 Q137 110 126 100" fill="${skin}"/><path d="M80 81 L101 81 L100 103 Q90 113 80 102 Z" fill="${skin}"/><path d="M60 51 Q60 9 94 9 Q125 10 128 47 L126 93 Q118 107 109 107 L112 52 L73 52 L72 106 Q58 103 55 84 Z" fill="#211922"/>${hair==='braids'?'<path d="M60 38 Q44 77 55 115 M124 35 Q143 72 130 116 M69 31 Q56 68 66 124 M113 28 Q129 65 118 125" fill="none" stroke="#241b23" stroke-width="9" stroke-linecap="round"/>':''}${hair==='bun'?'<circle cx="96" cy="19" r="21" fill="#211922"/>':''}<ellipse cx="90" cy="60" rx="32" ry="39" fill="${skin}"/><path d="M56 56 Q52 16 85 12 Q112 3 123 34 Q107 38 92 31 Q70 50 57 51 Z" fill="#221a24"/><path d="M73 62 Q81 58 86 63 M98 63 Q105 58 113 62" stroke="#2a1c23" fill="none" stroke-width="2" stroke-linecap="round"/><circle cx="80" cy="65" r="2.2" fill="#241b22"/><circle cx="105" cy="65" r="2.2" fill="#241b22"/><path d="M93 68 L91 76 Q94 78 98 76" fill="none" stroke="#6b372f" opacity=".65" stroke-width="1.5" stroke-linecap="round"/><path d="M82 84 Q91 91 101 83 Q93 95 82 84Z" fill="#913e55"/><circle cx="63" cy="81" r="3" fill="#f4cf87"/><circle cx="121" cy="81" r="3" fill="#f4cf87"/><path d="M64 95 Q90 88 117 96" stroke="#ffffff77" stroke-width="2" fill="none"/></svg>`}
function header(){document.getElementById('clock').innerHTML='JOUR '+s.day+'<br><span style="opacity:.75">'+String(s.hour).padStart(2,'0')+' h 00</span>';document.getElementById('wallet').textContent=format(s.money);document.getElementById('rank').textContent=rank();document.getElementById('meters').innerHTML=[['Énergie',s.energy,'e','⚡'],['Faim',s.hunger,'h','🥑'],['Bonheur',s.mood,'j','💗']].map(([name,v,c,icon])=>`<div class="meter"><div class="meterline"><span>${icon} ${name}</span><b>${v}%</b></div><div class="track"><div class="fill ${c}" style="width:${v}%"></div></div></div>`).join('')}
function button(action,id,label,cls='btn',disabled=false){return `<button type="button" class="${cls}" data-action="${action}" ${id?'data-id="'+id+'"':''} ${disabled?'disabled':''}>${label}</button>`}
function scene(){return `<div class="scene"><div class="sun"></div><div class="buildings"><div class="building"></div><div class="building"></div><div class="building"></div><div class="building"></div><div class="building"></div></div><div class="scene-ground"></div><div class="scene-tag">📍 Nova City · ${activeHome().name}</div><div class="scene-star">✨</div><div class="scene-svg">${svgAvatar()}</div><div class="scene-caption">Niveau ${s.level} · ${jobs.find(j=>j.id===s.job).name}</div></div>`}
function home(){const done=s.questDone.length,all=s.quests.length;return `<div class="welcome"><div><h2>Bonjour, Myriam 👋🏾</h2><p>Un nouveau chapitre commence aujourd'hui.</p></div><span class="pill">Niv. ${s.level}</span></div>${scene()}${weeklyPanel()}${gigPanel()}<div class="quick"><button data-action="work"><span class="emoji">💼</span>Travailler</button><button data-action="eat"><span class="emoji">🥙</span>Manger<br><span class="tiny">− 20 DH</span></button><button data-action="sleep"><span class="emoji">🌙</span>Dormir</button></div><div class="card"><div class="row"><div><h3>🎯 Tes missions du jour</h3><p>Avance à ton rythme. Bonus : 120 DH.</p></div><span class="pill">${done}/${all}</span></div><div class="progress"><span style="width:${100*done/all}%"></span></div>${s.quests.map(q=>`<div class="quest row"><span class="row" style="gap:9px;font-size:12px"><span class="check ${s.questDone.includes(q.id)?'done':''}">${s.questDone.includes(q.id)?'✓':q.emoji}</span>${q.title}</span>${s.questDone.includes(q.id)?'<span class="pill green">Fait</span>':''}</div>`).join('')}${done===all&&!s.questClaimed?button('claim',null,'🎁 Réclamer 120 DH','btn full'):''}${s.questClaimed?'<div class="pill green" style="margin-top:10px;display:inline-block">✅ Bonus reçu aujourd’hui</div>':''}</div><div class="two"><div class="card"><h3>🏢 Tes affaires</h3><p>Gains automatiques chaque nouveau jour</p><div class="item-price">+${format(dailyProfit())}/jour</div>${button('tab','empire','Développer →','btn secondary full')}</div><div class="card"><h3>🌟 Ton parcours</h3><p>Expérience et nouvelles possibilités</p><div class="item-price">Niveau ${s.level}</div><div class="progress"><span style="width:${Math.min(100,100*s.xp/(100+s.level*55))}%"></span></div></div></div><h2 class="section-title">📖 Ton journal</h2><div class="card">${s.logs.slice(0,4).map(l=>`<p style="padding:5px 0;margin:0"><b>Jour ${l.day}</b> · ${l.text}</p>`).join('')}</div>`}

function weekNumber(){return Math.floor((s.day-1)/7)+1}
function syncWeekly(){const w=weekNumber();if(!s.weekly||s.weekly.week!==w){s.weekly={week:w,work:0,study:0,social:0,claimed:false}}}
function weeklyTick(type){if(!['work','study','social'].includes(type))return;syncWeekly();s.weekly[type]=Math.min(type==='work'?3:2,(Number(s.weekly[type])||0)+1)}
function weeklyPanel(){syncWeekly();const w=s.weekly;const complete=w.work>=3&&w.study>=2&&w.social>=2;return `<div class="card" style="background:linear-gradient(125deg,#fff1f4,#f0eaff);border-color:#eadcf0"><div class="row"><div><h3>🌟 Ton défi de la semaine</h3><p>Une vraie vie équilibrée : travail, apprentissage et proches.</p></div><span class="pill">Sem. ${w.week}</span></div><div class="quest">💼 Journées de travail : <b>${w.work}/3</b></div><div class="quest">📚 Formations : <b>${w.study}/2</b></div><div class="quest">💌 Moments sociaux : <b>${w.social}/2</b></div><div class="progress"><span style="width:${Math.min(100,Math.round((w.work+w.study+w.social)/7*100))}%"></span></div><p style="margin-top:10px">🎁 Récompense : 280 DH + 40 XP</p>${complete&&!w.claimed?button('claimWeek',null,'🎁 Réclamer ma récompense','btn full'):''}${w.claimed?'<span class="pill green">✅ Défi réussi cette semaine !</span>':''}</div>`}
function availableGigs(){return [sideGigs[(s.day*2-2)%sideGigs.length],sideGigs[(s.day*2-1)%sideGigs.length]]}
function gigPanel(){if(!Array.isArray(s.gigsDone))s.gigsDone=[];return `<h2 class="section-title">🪙 Petites missions</h2><div class="card"><p>Des extras pour gagner de l'argent à ton rythme. Chaque mission n'est possible qu'une fois par jour.</p>${availableGigs().map((g,i)=>`<div class="list-card"><div class="tile-icon">${g.emoji}</div><div class="grow"><h3>${g.title}</h3><p>${g.desc} · ${g.hours} h · −${g.energy} énergie</p><span class="item-price">+${format(g.pay)}</span></div>${button('gig',g.id,s.gigsDone.includes(g.id)?'Fait ✓':'Accepter','btn small',s.gigsDone.includes(g.id))}</div>${i===0?'<div class="separator"></div>':''}`).join('')}</div>`}
function messagesPanel(){const m=chatMessages[(s.day-1)%chatMessages.length];const answered=s.lastMessageReplyDay===s.day;return `<h2 class="section-title">📱 Tes messages</h2><div class="card" style="background:#fff9fc"><div class="row"><div><span class="pill">Aujourd'hui</span><h3 style="margin-top:10px">${m.from}</h3></div><span style="font-size:30px">💬</span></div><p>${m.body}</p>${answered?'<span class="pill green">✅ Réponse envoyée</span>':button('reply',null,'💌 Répondre','btn full secondary')}<p style="font-size:11px;margin-top:10px">Tes proches continuent leur vie sans que tu aies à gérer leurs activités.</p></div>`}

function skillCard(name,emoji,key){return `<div class="skill"><b>${emoji} ${name} · ${skillLevel(key)}/10</b><div class="bar"><span style="width:${skillLevel(key)*10}%"></span></div></div>`}
function career(){const job=jobs.find(j=>j.id===s.job);return `<h2 class="section-title">💼 Ta carrière</h2><div class="card" style="background:linear-gradient(135deg,#f3eeff,#fff);border-color:#e2d8ff"><div class="row"><div><span class="pill">TON EMPLOI ACTUEL</span><h3 style="font-size:19px;margin-top:10px">${job.emoji} ${job.name}</h3><p>${job.desc}</p><strong style="color:#6c55d4">${format(job.pay+skillLevel('edu')*7+skillLevel('social')*4)} / service</strong></div></div>${button('work',null,'Commencer mon service · '+job.hours+' h','btn full')}</div><h2 class="section-title">📚 Investir en toi</h2><div class="card"><div class="skill-grid">${skillCard('Études','🎓','edu')}${skillCard('Réseau','🤝','social')}${skillCard('Cuisine','🧁','cooking')}${skillCard('Business','📊','business')}</div><div class="btn-row">${button('study','edu','🎓 Étudier · 25 DH','btn secondary')}${button('study','social','🤝 Réseauter · 20 DH','btn secondary')}${button('study','cooking','🧁 Cuisiner · 25 DH','btn secondary')}${button('study','business','📈 Formation business · 35 DH','btn secondary')}</div></div><h2 class="section-title">🪜 Les possibilités de carrière</h2><div class="card">${jobs.map(j=>{let locked=skillLevel('edu')<j.edu||skillLevel('social')<j.social;let selected=s.job===j.id;return `<div class="job-row ${locked?'locked':''}"><div class="tile-icon" style="width:43px;height:43px;font-size:22px">${j.emoji}</div><div class="grow"><h3>${j.name}</h3><p>${format(j.pay)} / service · ${j.hours} h${locked?`<br>Requis : études ${j.edu}, réseau ${j.social}`:''}</p></div>${selected?'<span class="pill green">Actuel</span>':button('chooseJob',j.id,locked?'🔒':'Choisir','btn small secondary',locked)}</div>`}).join('')}</div>`}
function bizCard(b){let owned=s.businesses[b.id]||0;let locked=skillLevel(b.skill)<b.req;let price=Math.round(b.cost*(.6+.35*owned));return `<div class="card item-card"><div class="item-info"><div class="tile-icon">${b.emoji}</div><div class="grow"><h3>${b.name}</h3><p>${b.desc}</p><div class="item-price">${owned?'+'+format(Math.round(b.profit*(1+(owned-1)*.65)))+'/jour':format(b.cost)}</div></div></div><div class="row"><span class="tiny">${owned?'⭐ Niveau '+owned+' · Bénéfices chaque jour':locked?'🔒 Nécessite '+skillNames[b.skill]+' niveau '+b.req:'🌱 Un nouveau business à lancer'}</span>${owned?button('upgradeBiz',b.id,'Améliorer · '+format(price),'btn small secondary',s.money<price):button('buyBiz',b.id,'Ouvrir','btn small',locked||s.money<b.cost)}</div></div>`}
function empire(){return `<h2 class="section-title">🏢 Ton empire</h2><div class="card" style="background:#222243;color:white"><div class="row"><div><div style="font-size:11px;color:#cfc8ff">REVENU AUTOMATIQUE</div><div style="font-size:28px;font-weight:900;margin:5px 0">+${format(dailyProfit())}<span style="font-size:12px"> / jour</span></div><p style="color:#bcb9db">${Object.keys(s.businesses).length} entreprise(s) · L'argent arrive quand un nouveau jour commence.</p></div><span style="font-size:35px">💸</span></div>${Object.keys(s.businesses).length?button('manage',null,'💼 Gérer mes entreprises','btn full'):''}</div><div class="tagline">💡 Commence par te former en cuisine ou en business, puis ouvre ta première entreprise. Elles te rapporteront de l'argent sans que tu aies à travailler à chaque fois.</div>${businesses.map(bizCard).join('')}<h2 class="section-title">🏡 Immobilier</h2>${homes.map((h,i)=>`<div class="card list-card"><div class="tile-icon">${h.emoji}</div><div class="grow"><h3>${h.name}</h3><p>${h.desc}</p><strong class="item-price">${i?format(h.price):'Logement initial'}</strong></div>${s.home===h.id?'<span class="pill green">Chez moi</span>':button('buyHome',h.id,'Acheter','btn small',s.money<h.price)}</div>`).join('')}<h2 class="section-title">🚘 Mes véhicules</h2>${cars.map((c,i)=>`<div class="card list-card"><div class="tile-icon">${c.emoji}</div><div class="grow"><h3>${c.name}</h3><p>${c.desc}</p><strong class="item-price">${i?format(c.price):'Gratuit'}</strong></div>${s.car===c.id?'<span class="pill green">Actuel</span>':button('buyCar',c.id,'Obtenir','btn small',s.money<c.price)}</div>`).join('')}`}
function city(){return `<h2 class="section-title">🌆 Nova City</h2><div class="tagline">Chaque lieu est une nouvelle possibilité. À toi de décider comment Myriam vit ses journées !</div>${messagesPanel()}<div class="card"><div class="list-card"><div class="tile-icon">🥐</div><div class="grow"><h3>La boulangerie du coin</h3><p>Un repas frais pour reprendre des forces.</p></div>${button('eat',null,'20 DH','btn small')}</div><div class="separator"></div><div class="list-card"><div class="tile-icon">🧖🏾‍♀️</div><div class="grow"><h3>Institut bien-être</h3><p>Un moment rien que pour toi : +30 bonheur.</p></div>${button('spa',null,'65 DH','btn small')}</div><div class="separator"></div><div class="list-card"><div class="tile-icon">🌳</div><div class="grow"><h3>Parc des Lumières</h3><p>Une promenade gratuite pour te détendre.</p></div>${button('park',null,'Aller','btn small secondary')}</div><div class="separator"></div><div class="list-card"><div class="tile-icon">🎬</div><div class="grow"><h3>Cinéma Étoile</h3><p>Profite de la vie en dehors du travail.</p></div>${button('cinema',null,'45 DH','btn small')}</div></div><h2 class="section-title">💬 Relations & rencontres</h2><div class="card"><div class="row"><h3>Ton cercle social</h3><span class="pill">${s.relations}/100 💕</span></div><p>Les personnages que tu rencontres continuent leur vie. Tu n'as pas à gérer leurs finances ou leurs activités.</p><div class="separator"></div><div class="list-card"><div class="tile-icon">👭🏾</div><div class="grow"><h3>Grâce, ton amie</h3><p>Un café ensemble pour papoter et rire.</p></div>${button('friend',null,'Inviter','btn small secondary')}</div><div class="separator"></div><div class="list-card"><div class="tile-icon">👩🏾‍🦱</div><div class="grow"><h3>Appeler la famille</h3><p>Prendre des nouvelles et garder le lien.</p></div>${button('family',null,'Appeler','btn small secondary')}</div><div class="separator"></div><div class="list-card"><div class="tile-icon">💌</div><div class="grow"><h3>Une rencontre</h3><p>Fais connaissance avec de nouvelles personnes.</p></div>${button('date',null,'Sortir','btn small secondary')}</div></div><h2 class="section-title">✨ Petite vie, grandes histoires</h2><div class="card"><h3>Une ville qui surprend</h3><p>Au fil des jours, des histoires te proposeront de faire des choix : accepter une opportunité, soutenir quelqu'un, investir ou prendre un risque.</p><span class="pill gold">🎭 Événements tous les 3 jours</span></div>`}

function render(){header();document.getElementById('nav').querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.getElementById('screen').innerHTML=({home,career,empire,city,me}[tab]||home)();save()}
function changeTab(t){tab=t;render();window.scrollTo({top:0,behavior:'instant'})}
function takeAction(name,id){switch(name){case'start':closeModal();s.firstSeen=true;save();render();return;case'cancel':closeModal();return;case'event':eventChoice(id);return;case'resetPrompt':confirmReset();return;case'reset':s=defaultState();closeModal();tab='home';save();render();intro();return;case'save':save();notify('💾 Partie enregistrée sur cet appareil.');return;case'tab':changeTab(id);return;case'claimWeek':{syncWeekly();let w=s.weekly;if(w.claimed||w.work<3||w.study<2||w.social<2)return;w.claimed=true;act({gain:280,xp:40,msg:'🌟 Défi de la semaine terminé ! 280 DH et 40 XP.'});return}
case'gig':{const g=availableGigs().find(g=>g.id===id);if(!g||s.gigsDone.includes(g.id))return;const ok=act({gain:g.pay,energy:-g.energy,hunger:-8,hours:g.hours,skill:g.skill,xp:12,msg:g.emoji+' Mission réussie : '+g.title+' !'});if(ok){s.gigsDone.push(g.id);save();render()}return}
case'reply':{if(s.lastMessageReplyDay===s.day)return;const m=chatMessages[(s.day-1)%chatMessages.length];s.lastMessageReplyDay=s.day;act({mood:m.mood,relations:m.relations,xp:6,weekly:'social',msg:'💬 Tu as répondu à '+m.from+'. '+m.reply});return}
case'claim':if(s.questDone.length===s.quests.length&&!s.questClaimed){s.questClaimed=true;act({gain:120,xp:30,msg:'🎁 Bonus quotidien de 120 DH reçu !'})}return;case'sleep':sleep();return;case'eat':act({cost:20,energy:3,hunger:42,mood:5,hours:1,xp:5,quest:'self',msg:'🥙 Un bon repas et de nouvelles forces !'});return;case'work':{let job=jobs.find(j=>j.id===s.job);act({gain:job.pay+skillLevel('edu')*7+skillLevel('social')*4,energy:-job.energy,hunger:-20,mood:-5,hours:job.hours,xp:22,quest:'work',weekly:'work',msg:'💼 Service terminé : '+format(job.pay+skillLevel('edu')*7+skillLevel('social')*4)+' gagnés.'});return}case'chooseJob':{let job=jobs.find(j=>j.id===id);if(!job||s.edu<job.edu||s.social<job.social)return;s.job=id;log('🎉 Myriam décroche le poste : '+job.name+'.');notify('🎉 Nouveau métier : '+job.name);save();render();return}case'study':{if(skillLevel(id)>=10){notify('🌟 Cette compétence est déjà au maximum !');return}let costs={edu:25,social:20,cooking:25,business:35};act({cost:costs[id],energy:-12,hunger:-10,mood:1,hours:2,skill:id,skillGain:1,xp:18,quest:'learn',weekly:'study',msg:'📚 '+skillNames[id]+' augmente : niveau '+(skillLevel(id)+1)+'/10 !'});return}case'buyBiz':{let b=businesses.find(b=>b.id===id);if(!b||s.businesses[id]||skillLevel(b.skill)<b.req)return;if(s.money<b.cost){notify('💸 Fonds insuffisants.');return}s.money-=b.cost;s.businesses[id]=1;gainXP(55);log('🎉 Myriam ouvre '+b.name+' !');checkAchievements();notify('🏢 Nouveau business : '+b.name);save();render();return}case'upgradeBiz':{let b=businesses.find(b=>b.id===id);if(!b||!s.businesses[id])return;let cost=Math.round(b.cost*(.6+.35*s.businesses[id]));if(s.money<cost){notify('💸 Il te manque '+format(cost-s.money));return}s.money-=cost;s.businesses[id]++;gainXP(25);log('🚀 '+b.name+' passe au niveau '+s.businesses[id]+' !');notify('🚀 Business amélioré !');save();render();return}case'manage':if(!Object.keys(s.businesses).length)return;act({gain:Math.round(dailyProfit()*.7),energy:-15,hunger:-10,mood:3,hours:2,skill:'business',xp:15,quest:'work',msg:'📊 Tu as géré tes activités et obtenu de nouvelles ventes.'});return;case'buyHome':{let home=homes.find(h=>h.id===id);if(!home||s.money<home.price)return;s.money-=home.price;s.home=id;gainXP(35);log('🔑 Nouvelle maison : '+home.name+' !');checkAchievements();notify('🏡 Félicitations pour ton nouveau logement !');save();render();return}case'buyCar':{let c=cars.find(c=>c.id===id);if(!c||s.money<c.price)return;s.money-=c.price;s.car=id;gainXP(20);log('🚘 Nouveau véhicule : '+c.name+'.');notify('🚘 C’est ton nouveau véhicule !');save();render();return}case'spa':act({cost:65,energy:7,hunger:-8,mood:30,hours:2,xp:6,quest:'self',msg:'🧖🏾‍♀️ Un vrai moment de détente !'});return;case'park':act({energy:6,hunger:-7,mood:16,hours:1,xp:8,quest:'self',msg:'🌳 Une promenade au grand air.'});return;case'cinema':act({cost:45,energy:-5,hunger:-9,mood:22,hours:2,xp:9,quest:'self',msg:'🎬 Une très belle séance de cinéma.'});return;case'friend':act({cost:30,energy:-5,hunger:10,mood:17,relations:15,hours:2,xp:10,quest:'self',weekly:'social',msg:'💗 Un café joyeux avec Grâce.'});return;case'family':act({energy:-2,mood:12,relations:10,hours:1,xp:7,quest:'self',weekly:'social',msg:'📞 Des nouvelles de la famille qui font plaisir.'});return;case'date':act({cost:40,energy:-7,hunger:-7,mood:20,relations:12,hours:2,xp:12,quest:'self',weekly:'social',msg:'💌 Tu fais une belle nouvelle rencontre !'});return;case'outfit':s.outfit=id;save();render();notify('👗 Tenue changée !');return;case'hair':s.hair=id;save();render();notify('💇🏾‍♀️ Nouvelle coiffure !');return;case'skin':s.skin=id;save();render();return;}}

 if(!s.family3||typeof s.family3!=='object')s.family3={};
 const f=s.family3;
 if(!romanceNPCsV3.some(p=>p.id===f.partnerId))f.partnerId=null;
 if(!['single','dating','engaged','married'].includes(f.status))f.status='single';
 if(typeof f.bond!=='number'||!Number.isFinite(f.bond))f.bond=0;
 if(typeof f.partnerWallet!=='number'||!Number.isFinite(f.partnerWallet))f.partnerWallet=0;

 if(!Array.isArray(f.memories))f.memories=[];

 if(!s.economy3||typeof s.economy3!=='object')s.economy3={};
 const e=s.economy3;
 if(!Number.isFinite(e.savings)||e.savings<0)e.savings=0;
 if(!Number.isFinite(e.fund)||e.fund<0)e.fund=0;

}

function partnerV3(){return romanceNPCsV3.find(p=>p.id===s.family3.partnerId)||null}
function childAgeV3(ch){return Math.min(24,Math.max(0,Math.floor((s.day-ch.bornDay)/12)))}
function familyTickV3(){
 initV3();const f=s.family3,e=s.economy3;
 if(f.lastDay<s.day){
  for(let d=Math.max(0,f.lastDay+1);d<=s.day;d++){
   const p=partnerV3();
   if(p){
    f.partnerWallet+=p.pay;
    if(d%6===0){f.bond=Math.min(100,f.bond+2);memoryV3('💼',p.name+' poursuit sa carrière de '+p.career.toLowerCase()+'. Ses revenus restent dans son propre budget.')}
   }
   for(const ch of f.children){
    const age=Math.min(24,Math.max(0,Math.floor((d-ch.bornDay)/12)));
    if(d>ch.bornDay&&(d-ch.bornDay)%12===0){
     memoryV3('🎂',ch.name+' fête ses '+age+' ans ! '+(age===4?'Entrée à l’école.':age===18?'Début de sa vie d’adulte autonome.':age>18?'Ses projets prennent forme.':'La famille grandit.'));
    }
    if(d>ch.bornDay&&d%5===0&&age<18){
     const cost=age<4?12:age<11?20:35;
     if(p)f.partnerWallet=Math.max(0,f.partnerWallet-cost);
     const what=age<4?'une activité d’éveil':age<11?'une sortie scolaire':'une activité entre jeunes';
     if(d%10===0)memoryV3('🎒',ch.name+' participe à '+what+'. La famille s’occupe automatiquement de l’organisation et des frais.');
    }
    if(d>ch.bornDay&&d%11===0&&age>=18){if(d%22===0)memoryV3('🌱',ch.name+' avance dans ses études, sa carrière et ses relations, sans intervention de Myriam.')}
   }
  }
  f.lastDay=s.day;
 }
 if(e.lastDay<s.day){
  for(let d=Math.max(0,e.lastDay+1);d<=s.day;d++){
   if(d%7===0){
    const interest=Math.floor(e.savings*.01);
    if(interest){e.savings+=interest;log('🏦 Ton épargne reçoit '+format(interest)+' d’intérêts fictifs.')}
    if(e.fund>0){const rates=[-.03,.015,.025,-.018,.032,.006,-.008];const rate=rates[Math.floor(d/7)%rates.length];const delta=Math.round(e.fund*rate);e.fund=Math.max(0,e.fund+delta);log('📈 Fonds virtuel : '+(delta>=0?'+':'')+format(delta)+' cette semaine.')}
   }
  }
  e.lastDay=s.day;
 }
}

empire=function(){return originalEmpireV3().replace('<h2 class="section-title">🏡 Immobilier</h2>',economyPanelV3()+'<h2 class="section-title">🏡 Immobilier</h2>')};
const originalMeV3=me;
me=function(){initV3();return originalMeV3()+'<div class="card"><h3>💞 Mon histoire personnelle</h3><p>Un foyer à ton image, sans obligations.</p><div class="stat-row"><span>Situation</span><b>'+romanceStatusV3()+'</b></div><div class="stat-row"><span>Enfants</span><b>'+s.family3.children.length+'</b></div><div class="stat-row"><span>Épargne personnelle</span><b>'+format(s.economy3.savings)+'</b></div>'+button('familyOpen',null,'Ouvrir ma famille','btn full secondary')+'</div>';};
const originalRenderV3=render;
render=function(){initV3();if(tab!=='family'){originalRenderV3();return;}header();document.querySelectorAll('#nav [data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.getElementById('screen').innerHTML=familyPanelV3();save();};
function familyDialogV3(title,body){document.getElementById('modal-body').innerHTML='<div class="big">💞</div><h2 id="modal-title">'+title+'</h2>'+body;document.getElementById('modal').classList.add('on');}
function familyResultV3(text){memoryV3('💞',text);save();render();notify(text)}
const oldTakeActionV3=takeAction;
takeAction=function(name,id){
 initV3();const f=s.family3,e=s.economy3;
 if(name==='familyOpen'){changeTab('family');return;}
 if(name==='familyMeet'){
  familyDialogV3('Une belle rencontre','<p>Choisis la personne avec qui Myriam aimerait faire connaissance. Chaque personnage vit de manière indépendante.</p>'+
  romanceNPCsV3.map(p=>'<button class="choice" data-action="familyPickPerson" data-id="'+p.id+'">'+p.emoji+' '+p.name+' — '+p.career+'<small>'+p.trait+'</small></button>').join('')+
  button('cancel',null,'Pas maintenant','btn full secondary'));return;
 }
 if(name==='familyPickPerson'){const p=romanceNPCsV3.find(p=>p.id===id);if(!p||f.partnerId)return;closeModal();f.partnerId=p.id;f.status='dating';f.bond=38;f.partnerWallet=320;familyResultV3('Myriam fait la connaissance de '+p.name+'. Une nouvelle histoire commence.');return;}
 if(name==='familyDate'){if(!partnerV3()||f.lastDateDay===s.day)return;f.bond=Math.min(100,f.bond+11);f.lastDateDay=s.day;s.mood=clamp(s.mood+8);s.relations=clamp(s.relations+4);gainXP(6);familyResultV3('Un joli moment avec '+partnerV3().name+' renforce votre complicité.');return;}
 if(name==='familyEngage'){if(!partnerV3()||f.status!=='dating'||f.bond<65)return;f.status='engaged';gainXP(25);familyResultV3('Myriam et '+partnerV3().name+' se sont fiancés ! 💍');return;}
 if(name==='familyWedding'){if(f.status!=='engaged')return;familyDialogV3('Le grand jour','<p>Organise un mariage qui te ressemble. Aucune cérémonie coûteuse n’est obligatoire.</p>'+button('familyMarry','simple','💒 Mariage intime · gratuit','choice')+button('familyMarry','grand','✨ Grande cérémonie · 600 DH','choice',s.money<600));return;}
 if(name==='familyMarry'){if(f.status!=='engaged'||(id!=='simple'&&id!=='grand'))return;const cost=id==='grand'?600:0;if(s.money<cost)return;s.money-=cost;closeModal();f.status='married';f.bond=Math.min(100,f.bond+15);gainXP(40);familyResultV3('Myriam et '+partnerV3().name+' célèbrent leur mariage !');return;}
 if(name==='familyLeaveConfirm'){if(!partnerV3())return;familyDialogV3('Un nouveau chapitre ?','<p>Tu peux quitter cette relation. Les enfants et les souvenirs resteront dans ton histoire.</p>'+button('familyLeave',null,'Confirmer la séparation','choice')+button('cancel',null,'Rester ensemble','choice alt'));return;}
 if(name==='familyLeave'){if(!partnerV3())return;const p=partnerV3();closeModal();f.partnerId=null;f.status='single';f.bond=0;familyResultV3('Myriam et '+p.name+' empruntent des chemins différents.');return;}
 if(name==='familyPlanBaby'){if(f.pending||f.children.length>=3)return;familyDialogV3('Un enfant dans mon histoire','<p>Choisis un prénom. L’arrivée sera possible dans 8 jours de jeu, mais tu déclencheras toi-même la naissance.</p>'+
 babyNamesV3.map(b=>button('familyChooseBaby',b.name,b.emoji+' '+b.name,'choice')).join('')+button('cancel',null,'Pas maintenant','choice alt'));return;}
 if(name==='familyChooseBaby'){const b=babyNamesV3.find(b=>b.name===id);if(!b||f.pending||f.children.length>=3)return;closeModal();f.pending={name:b.name,emoji:b.emoji,dueDay:s.day+8};familyResultV3('Le projet d’accueillir '+b.name+' est lancé. La naissance reste ton choix.');return;}
 if(name==='familyBirth'){if(!f.pending||s.day<f.pending.dueDay||f.children.length>=3)return;const b=f.pending;f.children.push({name:b.name,emoji:b.emoji,bornDay:s.day});f.pending=null;s.mood=clamp(s.mood+20);gainXP(40);familyResultV3('Bienvenue à '+b.name+' ! La famille s’agrandit. 👶🏾');return;}
 if(name==='familyCancelBaby'){if(!f.pending)return;f.pending=null;familyResultV3('Le projet est mis de côté. Myriam reste libre de ses décisions.');return;}
 if(name==='familyPet'){if(f.pets.length>=2||s.money<120)return;familyDialogV3('Un nouveau compagnon','<p>Choisis ton animal de compagnie.</p>'+button('familyPetChoose','🐶 Chien','🐶 Adopter un chien · 120 DH','choice')+button('familyPetChoose','🐱 Chat','🐱 Adopter un chat · 120 DH','choice'));return;}
 if(name==='familyPetChoose'){if(f.pets.length>=2||s.money<120||!['🐶 Chien','🐱 Chat'].includes(id))return;closeModal();s.money-=120;f.pets.push(id);familyResultV3(id+' rejoint ta maison !');return;}
 if(name==='familyDecor'){const d=decorListV3.find(d=>d.id===id);if(!d||f.decor.includes(id)||s.money<d.cost)return;s.money-=d.cost;f.decor.push(d.id);gainXP(10);familyResultV3(d.emoji+' '+d.name+' : une nouvelle décoration pour ton foyer.');return;}
 if(name==='bankDeposit'){const n=Number(id);if(![100,500].includes(n)||s.money<n)return;s.money-=n;e.savings+=n;save();render();notify('🏦 '+format(n)+' placés sur ton épargne.');return;}
 if(name==='bankWithdraw'){const n=id==='all'?e.savings:Number(id);if(!Number.isFinite(n)||n<1||n>e.savings||(id!=='all'&&n!==100))return;e.savings-=n;s.money+=n;save();render();notify('🏦 '+format(n)+' retirés de ton épargne.');return;}
 if(name==='fundBuy'){if(id!=='500'||s.money<500)return;s.money-=500;e.fund+=500;save();render();notify('📈 500 DH investis dans le fonds fictif.');return;}
 if(name==='fundSell'){if(id!=='all'||e.fund<1)return;const n=e.fund;e.fund=0;s.money+=n;save();render();notify('📈 Fonds revendu : '+format(n)+' récupérés.');return;}
 if(name==='hireManager'){if(!businesses.some(b=>b.id===id&&s.businesses[id])||e.managers.includes(id)||s.money<750)return;s.money-=750;e.managers.push(id);gainXP(15);log('👥 Un responsable prend en charge la gestion de '+businesses.find(b=>b.id===id).name+'.');save();render();notify('👥 Responsable recruté, bénéfices +20 %.');return;}
 oldTakeActionV3(name,id);
};
const navV3=document.getElementById('nav');
if(!navV3.querySelector('[data-tab="family"]'))navV3.querySelector('[data-tab="me"]').insertAdjacentHTML('beforebegin','<button type="button" data-tab="family"><span>💞</span>Famille</button>');

render();if(!s.firstSeen)setTimeout(intro,250);
})();
</script>
</body></html>
